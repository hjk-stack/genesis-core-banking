name: AVISPay UAT release diagnostics
on:
  pull_request:
    paths:
      - '.github/workflows/uat-release-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  remote-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify anonymous bank HTTPS release and access boundaries
        shell: bash
        run: |
          timeout 50s python3 - <<'PY'
          import base64, concurrent.futures, hashlib, json, re, ssl, urllib.error, urllib.request
          from datetime import datetime, timezone

          ORIGIN = "https://bank.avispay.online"
          RELEASE = "fe69c94bbdc8a4aa99fe094164f6a560185143b7"
          CASES = {"health": "/healthz", "document": "/", "api": "/api/session"}
          TLS = ssl.create_default_context()
          assert TLS.check_hostname and TLS.verify_mode == ssl.CERT_REQUIRED

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          def probe(item):
              name, path = item
              headers = {"User-Agent": "AVISPay-Anonymous-Bank-Probe/1.0", "Accept": "application/json"}
              if name == "document":
                  headers.update({"Accept": "text/html", "Sec-Fetch-Dest": "document", "Sec-Fetch-Mode": "navigate"})
              opener = urllib.request.build_opener(NoRedirect(), urllib.request.HTTPSHandler(context=TLS))
              try:
                  request = urllib.request.Request(ORIGIN + path, headers=headers, method="GET")
                  try:
                      response = opener.open(request, timeout=12)
                  except urllib.error.HTTPError as error:
                      response = error
                  with response:
                      body = response.read(16385)
                      if len(body) > 16384:
                          raise ValueError("response limit")
                      return name, {"url": response.geturl(), "status": response.code,
                          "contentType": response.headers.get("Content-Type", ""),
                          "cacheControl": response.headers.get("Cache-Control", ""),
                          "csp": response.headers.get("Content-Security-Policy", ""),
                          "requestId": response.headers.get("X-Request-Id", ""),
                          "body": body.decode("utf-8")}
              except Exception as error:
                  return name, {"url": ORIGIN + path, "error": type(error).__name__,
                      "reasonType": type(getattr(error, "reason", error)).__name__}

          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              results = dict(pool.map(probe, CASES.items()))

          def payload(name):
              try:
                  value = json.loads(results[name].get("body", ""))
                  return value if isinstance(value, dict) else {}
              except ValueError:
                  return {}

          health, document, api = (results[name] for name in ("health", "document", "api"))
          health["release"] = payload("health").get("release")
          api["code"] = payload("api").get("code")
          document["denialText"] = "You are not authorized to access this platform." in document.get("body", "")
          style = re.search(r"<style>(.*?)</style>", document.get("body", ""), re.S)
          style_hash = base64.b64encode(hashlib.sha256(style.group(1).encode()).digest()).decode() if style else ""
          checks = {
              "health_200_exact_release": health.get("status") == 200 and health.get("release") == RELEASE,
              "health_json": health.get("contentType", "").startswith("application/json"),
              "document_403_html": document.get("status") == 403 and document.get("contentType", "").startswith("text/html"),
              "document_denial_text": document["denialText"],
              "document_restricted_csp": all(value in document.get("csp", "") for value in
                  ("default-src 'none'", "frame-ancestors 'none'", "base-uri 'none'", "form-action 'none'")),
              "document_style_hash": bool(style_hash and ("'sha256-" + style_hash + "'") in document.get("csp", "")),
              "api_403_json": api.get("status") == 403 and api.get("contentType", "").startswith("application/json"),
              "api_machine_code": api.get("code") == "BANK_WORKSTATION_REQUIRED",
              "all_no_store": all("no-store" in result.get("cacheControl", "") for result in results.values()),
              "all_csp_present": all(bool(result.get("csp")) for result in results.values()),
              "no_redirects": all(result.get("url") == ORIGIN + CASES[name] and result.get("status") in (200, 403)
                  for name, result in results.items()),
          }
          for result in results.values():
              result.pop("body", None)
          print(json.dumps({"checkedAt": datetime.now(timezone.utc).isoformat(), "expectedRelease": RELEASE,
              "defaultTlsVerification": True, "checks": checks, "responses": results}, sort_keys=True), flush=True)
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("Failed checks: " + ", ".join(failed))
          print("Anonymous bank HTTPS verification passed for " + RELEASE, flush=True)
          PY
