name: GENESIS banking test server network (port 8443)

# Requested by the bank owner: "Yes prepare port 8443 for azure", "we must be operative and live interacting".
# Peer banks reach the FinTerminal's listening port 8443 only once the test server runs in an Azure environment
# with its own network (genesis-banking-uat/azure/move-uat-network.py). Started by hand only:
#   plan  - reads the test server and reports what apply would do; changes nothing.
#   apply - makes the network, its fixed outgoing address and the environment, moves the apps and opens 8443.
on:
  pull_request:
    paths: ['genesis-banking-uat/azure/move-uat-network.py', 'genesis-banking-uat/azure/test_move_uat_network.py', '.github/workflows/uat-network.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = read and report only; apply = make the network and move the test server'
        type: choice
        options: [plan, apply]
        default: plan
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify the move, its order, its put-back and that no secret is shown
        run: python3 -m unittest discover -s genesis-banking-uat/azure -p test_move_uat_network.py
  move:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Never while the bank app is being deployed.
    concurrency:
      group: avispay-existing-uat-application
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: aab5c083-8b0a-408b-aef7-89611822d66c
          tenant-id: 12f3ab80-cea3-41dd-bdee-47c009cbc960
          subscription-id: 24a900e4-ee6b-42c0-87c7-e3425bd74cf8
      - name: Test server network (${{ inputs.mode }})
        env:
          MODE: ${{ inputs.mode }}
        run: python3 genesis-banking-uat/azure/move-uat-network.py "$MODE"
