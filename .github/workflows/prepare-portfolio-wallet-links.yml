name: Prepare portfolio-linked wallet correction
on:
  push:
    branches: ['fix/portfolio-linked-crypto-wallets-20261117']
    paths: ['tools/apply_portfolio_wallet_links.py', '.github/workflows/prepare-portfolio-wallet-links.yml']
permissions:
  contents: write
concurrency:
  group: prepare-portfolio-linked-wallets
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/fix/portfolio-linked-crypto-wallets-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: avispay_ci
          POSTGRES_PASSWORD: avispay_ci
          POSTGRES_DB: avispay_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U avispay_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portfolio-linked-crypto-wallets-20261117
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Apply exact source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/apply_portfolio_wallet_links.py')
          source=p.read_text()
          source=source.replace('https://raw.githubusercontent.com/hjk-stack/genesis-outlook-automation/749d1862b030069ef9b95baba8a7988c604f37c1/src/bank-assets/avispay-logo.webp','https://avis.land/bank-assets/avispay-logo.webp')
          p.write_text(source)
          PY
          python3 tools/apply_portfolio_wallet_links.py
      - name: Check all modified JavaScript syntax
        run: |
          node --check genesis-banking-uat/portal/src/crypto-workspace.mjs
          node --check genesis-banking-uat/portal/src/crypto-asset-routing.mjs
          node --check genesis-banking-uat/portal/src/crypto-wallet-transfers.mjs
          node --check genesis-banking-uat/portal/public/crypto-workspace.mjs
          node --check genesis-banking-uat/portal/public/app.mjs
          node --check genesis-banking-uat/portal/server.mjs
      - name: Commit applied product changes on the same branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add genesis-banking-uat/portal
          git diff --cached --stat
          git commit -m "Link Portfolio history and booked crypto accounts; restore security converter and icon selector"
          git push origin HEAD:fix/portfolio-linked-crypto-wallets-20261117
      - name: Install test dependencies
        working-directory: genesis-banking-uat/portal
        run: npm ci --no-audit --no-fund
      - name: Verify exact routes, account reuse and existing wallet operations
        working-directory: genesis-banking-uat/portal
        env:
          TEST_DATABASE_URL: postgres://avispay_ci:avispay_ci@localhost:5432/avispay_ci
        run: >-
          node --test --test-concurrency=1
          test/crypto-asset-history.test.mjs
          test/crypto-workspace.test.mjs
          test/crypto-multichain-activation.test.mjs
          test/crypto-wallet-transfers.test.mjs
          test/crypto-workspace-ui.test.mjs
          test/account-management.test.mjs
