name: Assemble multi-coin integration
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  assemble:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/multi-coin-trade-allowance-scroller-20261117'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply checked source anchors and verify syntax
        run: |
          set -euo pipefail
          python3 .github/scripts/assemble-multicoin-scroller.py
          node --check genesis-banking-uat/portal/src/crypto-workspace.mjs
          node --check genesis-banking-uat/portal/src/wallet-trading-selection.mjs
          node --check genesis-banking-uat/portal/src/customer-access.mjs
          node --check genesis-banking-uat/portal/server.mjs
          node --check genesis-banking-uat/portal/public/crypto-workspace.mjs
          node --check genesis-banking-uat/portal/public/approved-robot.mjs
          node --check genesis-banking-uat/portal/public/wallet-trading-scroller.mjs
          python3 -m py_compile genesis-banking-uat/azure/deploy-sovereign.py genesis-banking-uat/azure/test_deploy_sovereign.py
          git diff --check
      - name: Commit source integration and remove this one-time assembly workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add genesis-banking-uat
          git rm .github/scripts/assemble-multicoin-scroller.py .github/workflows/assemble-multicoin.yml
          git commit -m 'Wire consented wallet allowances into first-row multi-coin robot scroller'
          git push origin HEAD:refs/heads/fix/multi-coin-trade-allowance-scroller-20261117
