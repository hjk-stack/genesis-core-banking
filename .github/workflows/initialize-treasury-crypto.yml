name: Initialize AVISPay treasury crypto
on:
  pull_request:
    paths: ['genesis-banking-uat/azure/initialize-crypto.py', 'genesis-banking-uat/azure/test_initialize_crypto.py', '.github/workflows/initialize-treasury-crypto.yml']
  push:
    branches: [main]
    paths: ['genesis-banking-uat/azure/initialize-crypto.py', 'genesis-banking-uat/azure/test_initialize_crypto.py', '.github/workflows/initialize-treasury-crypto.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify treasury ownership and preservation
        run: python3 -m unittest discover -s genesis-banking-uat/azure -p test_initialize_crypto.py
  initialize:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: avispay-existing-uat-application
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: aab5c083-8b0a-408b-aef7-89611822d66c
          tenant-id: 12f3ab80-cea3-41dd-bdee-47c009cbc960
          subscription-id: 24a900e4-ee6b-42c0-87c7-e3425bd74cf8
      - name: Activate institution wallet and verify public-chain balances and QR
        run: python3 genesis-banking-uat/azure/initialize-crypto.py
