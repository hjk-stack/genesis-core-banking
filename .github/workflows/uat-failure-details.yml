name: UAT focused failure evidence
on:
  pull_request:
    paths: ['.github/workflows/uat-failure-details.yml']
  workflow_dispatch:
    inputs:
      job_id:
        description: Failed GitHub Actions job to inspect
        required: true
        default: '134345834835'
permissions:
  contents: read
  actions: read
jobs:
  browser-failure-details:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read failed assertion blocks
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_JOB: ${{ inputs.job_id || '134345834835' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_JOB" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$TARGET_JOB/logs" > "$RUNNER_TEMP/failed-job.log"
          python3 - <<'PY'
          import os, pathlib, re
          lines = pathlib.Path(os.environ['RUNNER_TEMP'], 'failed-job.log').read_text().splitlines()
          failures = [i for i, line in enumerate(lines) if re.search(r'not ok \d+ - ', line)]
          print('FAILED TEST COUNT:', len(failures))
          for i in failures[:12]:
              print('\n'.join(re.sub(r'\x1b\[[0-9;]*m', '', s) for s in lines[i:i+34]))
          PY
