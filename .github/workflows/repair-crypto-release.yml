name: Apply scoped Crypto Suite release correction
on:
  pull_request:
    paths: ['.github/workflows/repair-crypto-release.yml']
permissions:
  contents: write
jobs:
  correct:
    if: github.event.pull_request.number == 72 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/portfolio-linked-crypto-wallets-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/portfolio-linked-crypto-wallets-20261117
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Remove duplicate restoration UI without touching financial records
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('genesis-banking-uat/portal')
          path=root/'public/crypto-workspace.mjs'
          raw=path.read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          if blob!='947e97e5c652800bc011e7a90f250bd406a1ec6c':
              raise RuntimeError('Wallet controller changed; refusing an unreviewed edit')
          source=raw.decode()
          start=source.index("  const archive=q('[data-archived-wallets]');")
          end=source.index("  host.querySelectorAll('[data-add-asset]')",start)
          source=source[:start]+source[end:]
          strip='<details class="crypto-wallet-archive"><summary>Removed wallet cards · Restore</summary><div data-archived-wallets></div></details>'
          if source.count(strip)!=1: raise RuntimeError('Restore strip anchor changed')
          source=source.replace(strip,'')
          if 'data-restore-wallet' in source or 'data-archived-wallets' in source:
              raise RuntimeError('Unexpected restoration code remains')
          path.write_text(source)
          css=root/'public/crypto.css'
          css.write_text(''.join(line for line in css.read_text().splitlines(keepends=True)
                                 if not line.startswith('.crypto-wallet-archive')))
          # Reuse the actual application import graph in all real-shell fixtures.
          for name in ('accounts-portfolio-layout.mjs','card-workspace-layout.mjs','securities-portfolio-layout.mjs'):
              file=root/'test-browser'/name
              source=file.read_text()
              anchor="'/crypto-workspace.mjs'"
              if source.count(anchor)!=1: raise RuntimeError('Fixture module route changed: '+name)
              source=source.replace(anchor,"'/approved-robot.mjs',"+anchor)
              file.write_text(source)
          test=root/'test/crypto-workspace-ui.test.mjs'
          source=test.read_text()
          source=source.replace('admin can remove and restore a single wallet card without touching its original address or account fields',
                                'admin removes a wallet card without exposing duplicate restore controls or changing original records')
          start=source.index(' const restore=document.querySelector(\'[data-restore-wallet="00000000-0000-4000-8000-000000000071"]\');')
          end=source.index(' assert.equal(views.cryptowallets[0].public_address',start)
          source=source[:start]+''' assert.equal(document.querySelector('.crypto-wallet-archive'),null);
           assert.equal(document.querySelector('[data-restore-wallet]'),null);
           await workspace.mount(document.querySelector('#view'));
           assert.equal(document.querySelector('[data-wallet="00000000-0000-4000-8000-000000000071"]'),null);
           assert.equal(document.querySelector('[data-restore-wallet]'),null);
          '''+source[end:]
          old="actions.filter(a=>a.path==='crypto/wallet/visibility').map(a=>a.input.visible),[false,true]"
          if source.count(old)!=1: raise RuntimeError('Visibility assertion changed')
          source=source.replace(old,"actions.filter(a=>a.path==='crypto/wallet/visibility').map(a=>a.input.visible),[false]")
          test.write_text(source)
          print('Removed restore-strip markup, handlers and styles; retained all account activation, routing and financial code.')
          PY
      - name: Validate exact modified controllers and focused regressions
        working-directory: genesis-banking-uat/portal
        run: |
          npm ci --no-audit --no-fund
          node --check public/crypto-workspace.mjs
          node --check test/crypto-workspace-ui.test.mjs
          node --check test-browser/accounts-portfolio-layout.mjs
          node --check test-browser/card-workspace-layout.mjs
          node --check test-browser/securities-portfolio-layout.mjs
          node --test test/crypto-workspace-ui.test.mjs
      - name: Commit only reviewed application fixes and remove this one-time repair
        run: |
          set -euo pipefail
          git config user.name 'AVISPay release automation'
          git config user.email 'avispay-release@users.noreply.github.com'
          git rm .github/workflows/repair-crypto-release.yml
          git add genesis-banking-uat/portal/public/crypto-workspace.mjs genesis-banking-uat/portal/public/crypto.css genesis-banking-uat/portal/test/crypto-workspace-ui.test.mjs genesis-banking-uat/portal/test-browser/accounts-portfolio-layout.mjs genesis-banking-uat/portal/test-browser/card-workspace-layout.mjs genesis-banking-uat/portal/test-browser/securities-portfolio-layout.mjs
          git diff --cached --stat
          git commit -m 'Remove duplicate wallet restore controls and load approved robot in real-shell browser tests'
          git push origin HEAD:fix/portfolio-linked-crypto-wallets-20261117
