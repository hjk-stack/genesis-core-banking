name: AVISPay sovereign UAT
on:
  pull_request:
    paths: ['genesis-banking-uat/portal/**', 'genesis-banking-uat/azure/deploy-sovereign.py', 'genesis-banking-uat/azure/test_deploy_sovereign.py', 'genesis-banking-uat/azure/verify-existing-crypto.py', 'genesis-banking-uat/azure/test_verify_existing_crypto.py', '.github/workflows/sovereign-uat.yml']
  push:
    branches: [main]
    paths: ['genesis-banking-uat/portal/**', 'genesis-banking-uat/azure/deploy-sovereign.py', 'genesis-banking-uat/azure/test_deploy_sovereign.py', 'genesis-banking-uat/azure/verify-existing-crypto.py', 'genesis-banking-uat/azure/test_verify_existing_crypto.py', '.github/workflows/sovereign-uat.yml']
  workflow_dispatch:
    inputs:
      deploy_existing_uat:
        description: 'Update only the existing genesis-banking-uat application'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: avispay_ci
          POSTGRES_PASSWORD: avispay_ci
          POSTGRES_DB: avispay_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U avispay_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install application and test dependencies
        working-directory: genesis-banking-uat/portal
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: genesis-banking-uat/portal/trading/requirements.txt
      - name: Verify Nautilus W-effect runtime and exact contract artifacts
        working-directory: genesis-banking-uat/portal
        run: |
          pip install -r trading/requirements.txt
          python -m unittest discover -s trading -p 'test_*.py'
          npm run contracts:compile
          git diff --exit-code -- contracts/artifacts
      - name: Check server and browser module syntax
        working-directory: genesis-banking-uat/portal
        run: |
          node --check server.mjs
          node --check public/app.mjs
          node --check public/checkout-ip.mjs
          node --check src/checkout-ip-processing.mjs
          node --check src/checkout-pos-auth.mjs
          node --check public/payment-wizard.mjs
          node --check public/card-message.mjs
          node --check public/cards.mjs
          node --check public/accounts.mjs
          node --check public/portfolio.mjs
          node --check public/crypto-workspace.mjs
          python3 -m py_compile ../azure/deploy-sovereign.py ../azure/verify-existing-crypto.py
          python3 -m unittest discover -s ../azure -p 'test_*.py'
      - name: Verify sovereign banking on PostgreSQL
        working-directory: genesis-banking-uat/portal
        env:
          TEST_DATABASE_URL: postgres://avispay_ci:avispay_ci@localhost:5432/avispay_ci
        run: |
          export AVIS_TRADING_TEST_PYTHON="$(command -v python)"
          env -i PATH=/usr/local/bin:/usr/bin:/bin LANG=C.UTF-8 TZ=UTC "$AVIS_TRADING_TEST_PYTHON" -I -c 'import nautilus_trader; print(nautilus_trader.__version__)'
          npm test
      - name: Build banking application container
        run: docker build -t avispay-sovereign:ci genesis-banking-uat/portal
      - name: Verify payment popup layout in Chromium
        working-directory: genesis-banking-uat/portal
        run: |
          npx playwright install --with-deps chromium
          node --test test-browser/*.mjs
      - name: Save trading test layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trading-test-layout
          path: |
            genesis-banking-uat/portal/test-results/crypto-trading-tests-*.png
            genesis-banking-uat/portal/test-results/crypto-live-trader-*.png
            genesis-banking-uat/portal/test-results/crypto-trader-instructions-*.png
            genesis-banking-uat/portal/test-results/treasury-source-*.png
            genesis-banking-uat/portal/test-results/checkout-ip-*.png
            genesis-banking-uat/portal/test-results/nostro-clearing-*.png
            genesis-banking-uat/portal/test-results/nostro-statements-*.png
            genesis-banking-uat/portal/test-results/bank-access-*.png
          if-no-files-found: ignore
          retention-days: 7
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy_existing_uat)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: avispay-existing-uat-application
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: aab5c083-8b0a-408b-aef7-89611822d66c
          tenant-id: 12f3ab80-cea3-41dd-bdee-47c009cbc960
          subscription-id: 24a900e4-ee6b-42c0-87c7-e3425bd74cf8
      - name: Build and push application to the existing registry
        shell: bash
        run: |
          set -euo pipefail
          az containerapp show -g genesis-banking-rg -n genesis-banking-uat -o none
          SERVER=$(az acr show -g genesis-banking-rg -n genesisbankingacr --query loginServer -o tsv)
          az acr login -n genesisbankingacr
          docker build -t "$SERVER/avispay-sovereign:$GITHUB_SHA" genesis-banking-uat/portal
          docker push "$SERVER/avispay-sovereign:$GITHUB_SHA"
          echo "AVISPAY_IMAGE=$SERVER/avispay-sovereign:$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Update existing application and verify authenticated banking reads
        env:
          AVISPAY_PROVIDER_COINAPI_EMS_API_KEY: ${{ secrets.AVISPAY_PROVIDER_COINAPI_EMS_API_KEY }}
          AVISPAY_PROVIDER_COINAPI_NAAS_API_KEY: ${{ secrets.AVISPAY_PROVIDER_COINAPI_NAAS_API_KEY }}
          AVISPAY_PROVIDER_COINAPI_API_KEY: ${{ secrets.AVISPAY_PROVIDER_COINAPI_API_KEY }}
          AVISPAY_PROVIDER_COINAPI_MARKET_DATA_API_KEY: ${{ secrets.AVISPAY_PROVIDER_COINAPI_MARKET_DATA_API_KEY }}
          AVISPAY_PROVIDER_COINAPI_INDEXES_API_KEY: ${{ secrets.AVISPAY_PROVIDER_COINAPI_INDEXES_API_KEY }}
          AVISPAY_PROVIDER_APIBRICKS_COINAPI_KEY: ${{ secrets.AVISPAY_PROVIDER_APIBRICKS_COINAPI_KEY }}
          AVISPAY_PROVIDER_ALCHEMY_API_KEY: ${{ secrets.AVISPAY_PROVIDER_ALCHEMY_API_KEY }}
          AVISPAY_PROVIDER_TRONGRID_API_KEY: ${{ secrets.AVISPAY_PROVIDER_TRONGRID_API_KEY }}
          AVISPAY_PROVIDER_COINGECKO_API_KEY: ${{ secrets.AVISPAY_PROVIDER_COINGECKO_API_KEY }}
          AVISPAY_PROVIDER_STRIPE_SECRET_KEY: ${{ secrets.AVISPAY_PROVIDER_STRIPE_SECRET_KEY }}
          AVISPAY_PROVIDER_STRIPE_WEBHOOK_SECRET: ${{ secrets.AVISPAY_PROVIDER_STRIPE_WEBHOOK_SECRET }}
        run: python3 genesis-banking-uat/azure/deploy-sovereign.py
      - name: Activate existing AG and AGi wallets and verify authenticated receiving evidence
        run: python3 genesis-banking-uat/azure/verify-existing-crypto.py
      - name: Save authenticated wallet activation evidence
        uses: actions/upload-artifact@v4
        with:
          name: avispay-crypto-wallet-evidence
          path: ${{ runner.temp }}/avispay-crypto-wallet-evidence.json
          if-no-files-found: error
          retention-days: 30
