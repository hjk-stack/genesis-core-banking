name: AVISPay sovereign UAT
on:
  pull_request:
    paths: ['genesis-banking-uat/portal/**', '.github/workflows/sovereign-uat.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: avispay_ci
          POSTGRES_PASSWORD: avispay_ci
          POSTGRES_DB: avispay_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U avispay_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install application and test dependencies
        working-directory: genesis-banking-uat/portal
        run: npm ci --no-audit --no-fund
      - name: Verify sovereign banking on PostgreSQL
        working-directory: genesis-banking-uat/portal
        env:
          TEST_DATABASE_URL: postgres://avispay_ci:avispay_ci@localhost:5432/avispay_ci
        run: npm test
      - name: Build banking application container
        run: docker build -t avispay-sovereign:ci genesis-banking-uat/portal
